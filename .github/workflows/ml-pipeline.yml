name: ML CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"   # weekly retrain every Monday 2am UTC

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: fraud-detection
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

jobs:
  # ── 1. Code quality ──────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Unit tests
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  # ── 2. Data validation ───────────────────────────────────────────────────────
  validate-data:
    name: Data validation
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data with DVC
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull data/creditcard.csv.dvc
          dvc pull data/reference.csv.dvc

      - name: Run Great Expectations validation
        run: python scripts/validate_data.py

  # ── 3. Train & evaluate (quality gate) ──────────────────────────────────────
  train-and-evaluate:
    name: Train model + quality gate
    runs-on: ubuntu-latest
    needs: validate-data
    outputs:
      run_id:  ${{ steps.train.outputs.run_id }}
      roc_auc: ${{ steps.train.outputs.roc_auc }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc pull

      - name: Train model
        id: train
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          python src/train.py
          RUN_ID=$(python -c "import json; d=json.load(open('metrics.json')); print(d.get('run_id',''))")
          AUC=$(python -c "import json; d=json.load(open('metrics.json')); print(d['best_roc_auc'])")
          echo "run_id=$RUN_ID"  >> $GITHUB_OUTPUT
          echo "roc_auc=$AUC"    >> $GITHUB_OUTPUT

      - name: Quality gate — AUC must be >= 0.95
        run: |
          AUC=${{ steps.train.outputs.roc_auc }}
          python -c "
          auc = float('$AUC')
          threshold = 0.95
          print(f'AUC: {auc:.4f}  |  Threshold: {threshold}')
          assert auc >= threshold, f'Quality gate FAILED: AUC {auc:.4f} < {threshold}'
          print('Quality gate PASSED')
          "

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-metrics
          path: metrics.json

  # ── 4. Build & push Docker image ─────────────────────────────────────────────
  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: train-and-evaluate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:      ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$IMAGE_NAME:latest \
                       --build-arg GIT_SHA=$IMAGE_TAG .
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest

  # ── 5. Deploy to staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Promote model to Staging in MLflow registry
        env:
          RUN_ID: ${{ needs.train-and-evaluate.outputs.run_id }}
        run: python scripts/promote_model.py --run-id $RUN_ID --stage Staging

      - name: Deploy to staging ECS / EC2
        run: echo "Deploy step — replace with your cloud deploy command"

      - name: Smoke test staging endpoint
        run: |
          python scripts/smoke_test.py \
            --url ${{ secrets.STAGING_URL }} \
            --threshold 0.95

  # ── 6. Deploy to production (manual approval) ────────────────────────────────
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production   # requires manual approval in GitHub
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Promote model to Production in MLflow registry
        env:
          RUN_ID: ${{ needs.train-and-evaluate.outputs.run_id }}
        run: python scripts/promote_model.py --run-id $RUN_ID --stage Production

      - name: Deploy to production
        run: echo "Deploy step — replace with your cloud deploy command"